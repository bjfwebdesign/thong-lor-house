<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holiday home</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   THEME: re-theme a client site by editing these tokens only.
   ===================================================================== */
:root{
  --bg:        #F5F0E7;   /* linen page background */
  --surface:   #FBF8F2;   /* cards, panels */
  --sand:      #EAE1D1;   /* alternate section background */
  --line:      #D8CCB8;   /* hairlines, borders */
  --ink:       #2A221C;   /* headings and body text */
  --ink-soft:  #5E5248;   /* secondary text (AA on --bg and --sand) */
  --accent:    #56653A;   /* muted olive: buttons, selected dates */
  --accent-ink:#FFFFFF;   /* text on accent */
  --accent-tint:#DDE1CC;  /* selected date range */
  --booked:    #CFC3AF;   /* booked-date hatching */
  --dark:      #1E1915;   /* footer, lightbox */

  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans:  "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --gutter: clamp(16px, 4vw, 48px);
  --maxw: 1240px;
  --radius: 4px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:350;line-height:1.08;letter-spacing:-.015em;margin:0;font-variation-settings:"SOFT" 30}
p{margin:0 0 1em}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px}
.skip:focus{left:8px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
section{scroll-margin-top:64px}

.eyebrow{font:600 12px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px}
.h2{font-size:clamp(2.1rem,4.6vw,3.5rem)}
.lede{font-size:clamp(1.05rem,1.4vw,1.2rem);color:var(--ink-soft);max-width:36em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;
  background:var(--accent);color:var(--accent-ink);font:500 15px/1 var(--sans);letter-spacing:.01em;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
.btn-light{background:var(--bg);color:var(--ink)}
.btn-light:hover{background:#fff}
.btn-line{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--bg)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- Reveal on scroll ---------- */
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s ease}
.js .reveal.in{opacity:1;transform:none}

/* ---------- Nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;
  height:64px;padding-inline:var(--gutter);color:#fff;transition:background .35s,color .35s,box-shadow .35s}
.nav.solid{background:var(--bg);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.brand{font:400 21px/1 var(--serif);text-decoration:none;letter-spacing:-.01em;white-space:nowrap;min-height:44px;display:flex;align-items:center}
.nav-links{display:none;gap:4px}
.nav-links a{font-size:15px;text-decoration:none;padding:12px 12px;opacity:.9}
.nav-links a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid currentColor;border-radius:999px;padding:2px}
.lang button{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:currentColor}
.lang button[aria-pressed="true"] span{color:var(--ink)}
.nav.solid .lang button[aria-pressed="true"] span{color:var(--bg)}
.nav-cta{display:none;min-height:44px;padding:0 20px}
.nav:not(.solid) .nav-cta{background:var(--bg);color:var(--ink)}
@media (min-width:960px){.nav-links{display:flex}.nav-cta{display:inline-flex}}

/* ---------- Hero ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;color:#fff;background:var(--dark)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 60%;animation:heroZoom 40s ease-out forwards}
@keyframes heroZoom{from{transform:scale(1.001)}to{transform:scale(1.1)}}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,10,.45) 0%,rgba(20,15,10,0) 22%,rgba(20,15,10,0) 42%,rgba(20,15,10,.72) 100%)}
.hero-inner{position:absolute;inset:auto 0 0 0;padding-bottom:clamp(40px,8vh,88px)}
.hero h1{font-size:clamp(3.1rem,10vw,8rem);font-weight:300;letter-spacing:-.03em;margin-bottom:.18em;text-wrap:balance}
.hero-tagline{font:300 clamp(1.15rem,2.2vw,1.6rem)/1.35 var(--serif);max-width:30em;margin-bottom:22px;text-wrap:balance}
.hero-facts{display:flex;flex-wrap:wrap;row-gap:2px;font-size:14px;letter-spacing:.04em;margin-bottom:18px;opacity:.95}
.hero-facts span{white-space:nowrap}
.hero-facts span+span::before{content:"·";margin:0 .6em;opacity:.7}

/* ---------- Section rhythm ---------- */
.section{padding-block:clamp(72px,11vw,150px)}
.section-head{margin-bottom:clamp(32px,5vw,56px)}
.alt{background:var(--sand)}

/* ---------- Gallery ---------- */
.gallery-top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px 32px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--gutter)*-1);padding:2px var(--gutter)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--ink);transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (min-width:760px){.chips{margin:0;padding:2px}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:46vw;gap:6px;padding-inline:6px;margin-top:32px;grid-auto-flow:dense}
.tile{grid-column:span var(--mc,1);grid-row:span var(--mr,1);position:relative;overflow:hidden;border:0;padding:0;background:var(--sand);display:block;animation:tileIn .6s ease both}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.6,.2,1)}
.tile:hover img{transform:scale(1.035)}
.tile .cap{position:absolute;left:0;bottom:0;padding:10px 14px;font-size:13px;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0));width:100%;text-align:left;opacity:0;transition:opacity .3s}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
.tile:focus-visible{outline-offset:-3px;outline-color:#fff}
@keyframes tileIn{from{opacity:0}to{opacity:1}}
@media (min-width:760px){
  .grid{grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(150px,17vw,280px);gap:8px;padding-inline:8px}
  .tile{grid-column:span var(--c,4);grid-row:span var(--r,1)}
}
.gallery-more{text-align:center;margin-top:32px}

/* ---------- House ---------- */
.house{display:grid;gap:48px}
.house-copy p{font-size:1.08rem;max-width:34em}
.sleep{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sleep li{display:grid;grid-template-columns:88px 1fr;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.sleep img{width:88px;height:88px;object-fit:cover;border-radius:var(--radius)}
.sleep h3{font-size:1.35rem;margin-bottom:2px}
.sleep .floor{font-size:13px;color:var(--ink-soft);letter-spacing:.04em}
.beds{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:15px}
.bed{display:inline-flex;align-items:center;gap:7px}
.bed svg{width:30px;height:20px;color:var(--accent)}
@media (min-width:900px){.house{grid-template-columns:1fr 1fr;gap:clamp(48px,8vw,120px);align-items:start}}

/* ---------- Amenities ---------- */
.amen{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.amen li{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.35}
.amen svg{width:26px;height:26px;flex:none;color:var(--accent);stroke-width:1.4}
@media (min-width:900px){
  .amen-layout{display:grid;grid-template-columns:5fr 7fr;gap:clamp(48px,8vw,120px);align-items:start}
  .amen{column-gap:40px}.amen li{font-size:16px;padding:18px 0}
}

/* ---------- Location ---------- */
.band{position:relative;height:clamp(320px,62vh,640px);overflow:hidden}
.band img{width:100%;height:100%;object-fit:cover}
.band-cap{position:absolute;left:var(--gutter);bottom:18px;color:#fff;font-size:13px;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.loc{display:grid;gap:40px}
.places{list-style:none;margin:0;padding:0}
.places li{display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.places .name{flex:none;max-width:62%}
.places .dots{flex:1;border-bottom:1px dotted var(--ink-soft);opacity:.5;transform:translateY(-4px)}
.places .time{flex:none;color:var(--ink-soft);font-size:15px;text-align:right}
.private{display:flex;gap:10px;align-items:flex-start;margin-top:24px;font-size:15px;color:var(--ink-soft)}
.private svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--accent)}
@media (min-width:900px){.loc{grid-template-columns:5fr 7fr;gap:clamp(48px,8vw,120px)}}

/* ---------- Reviews ---------- */
.rating{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:12px}
.rating .score{font:300 clamp(3rem,6vw,4.5rem)/1 var(--serif)}
.rating .stars{display:inline-flex;gap:3px;color:var(--accent)}
.rating .stars svg{width:18px;height:18px}
.rating .label{color:var(--ink-soft);font-size:15px}
.reviews{display:grid;gap:16px}
.review{position:relative;background:var(--surface);padding:32px 28px 28px;border-radius:var(--radius);display:flex;flex-direction:column;border:1px dashed transparent}
.review.is-sample{border-color:var(--line)}
.review blockquote{margin:0 0 20px;font:300 1.2rem/1.5 var(--serif);font-style:italic}
.review:first-child blockquote{font-size:clamp(1.3rem,2.2vw,1.65rem)}
.review footer{margin-top:auto;font-size:14px;color:var(--ink-soft)}
.review footer strong{color:var(--ink);font-weight:600}
.sample-tag{position:absolute;top:12px;right:12px;font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);padding:6px 8px;border-radius:999px}
@media (min-width:900px){.reviews{grid-template-columns:1.35fr 1fr}.review:first-child{grid-row:span 2;padding:48px}}

/* ---------- Availability ---------- */
.book{display:grid;gap:32px}
.cal-card,.panel{background:var(--surface);border-radius:var(--radius);padding:clamp(18px,3vw,32px)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.demo-badge{display:inline-flex;align-items:center;gap:8px;font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.demo-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#B7773F}
.cal-nav{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover:not(:disabled){border-color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}
.months{display:grid;gap:32px}
@media (min-width:900px){.months.two{grid-template-columns:1fr 1fr}}
.month h3{font:400 1.25rem/1.2 var(--serif);text-align:center;margin-bottom:12px;text-transform:capitalize}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{font-size:12px;text-align:center;color:var(--ink-soft);padding-bottom:6px;text-transform:capitalize}
.day{position:relative;height:46px;border:0;background:transparent;padding:0;font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;z-index:0}
.day::before{content:"";position:absolute;inset:3px;border-radius:50%;z-index:-1;transition:background .15s}
.day:not(:disabled):hover::before{background:var(--sand)}
.day:disabled{cursor:default;color:#A2968A}
.day.past{color:#B9AEA2}
.day.booked{color:#8E8175;text-decoration:line-through;text-decoration-color:rgba(94,82,72,.5)}
.day.booked::after{content:"";position:absolute;inset:3px;border-radius:50%;z-index:-1;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--booked) 4px 5.5px)}
.day.booked.co-ok{color:var(--ink);text-decoration:none;cursor:pointer}
.day.today{font-weight:600}
.day.today::after{content:"";position:absolute;bottom:8px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.day.in-range{background:var(--accent-tint)}
.day.start,.day.end{color:var(--accent-ink);font-weight:600}
.day.start::before,.day.end::before{background:var(--accent)!important}
.day.start.has-end{background:linear-gradient(90deg,transparent 50%,var(--accent-tint) 50%)}
.day.end{background:linear-gradient(90deg,var(--accent-tint) 50%,transparent 50%)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:18px;font-size:13px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.legend .l-booked{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--booked) 3px 4.5px)}
.legend .l-sel{background:var(--accent);border-color:var(--accent)}
.cal-status{min-height:1.6em;margin:14px 0 0;font-size:14px;color:var(--ink-soft)}
.cal-status.warn{color:#8A3B1E}

.rates{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.rates th,.rates td{text-align:left;padding:12px 0;border-bottom:1px solid var(--line);font-weight:400;vertical-align:top}
.rates td{text-align:right;white-space:nowrap;padding-left:16px}
.rates th small{display:block;color:var(--ink-soft);font-size:13px}
.rates-title{font:400 1.25rem/1.2 var(--serif);margin:32px 0 4px}

.panel{align-self:start}
.panel-from{font:300 1.9rem/1.1 var(--serif);margin-bottom:4px}
.panel-from small{font:400 15px var(--sans);color:var(--ink-soft)}
.fields{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);margin:20px 0 12px}
.field{padding:10px 14px;min-height:60px;background:transparent;border:0;text-align:left;display:flex;flex-direction:column;justify-content:center}
.field+.field{border-left:1px solid var(--line)}
.field span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.field strong{font-weight:500;font-size:15px}
.guests{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--radius);padding:8px 8px 8px 14px}
.guests .lbl span{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.breakdown{list-style:none;margin:20px 0 0;padding:0;font-size:15px}
.breakdown li{display:flex;justify-content:space-between;gap:16px;padding:7px 0}
.breakdown .muted{color:var(--ink-soft);font-size:13px;padding-top:0}
.breakdown .total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:600;font-size:17px}
.breakdown .discount span:last-child{color:var(--accent)}
.save{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);margin:12px 0 0}
.save svg{width:16px;height:16px;flex:none}
.empty{font-size:15px;color:var(--ink-soft);margin:20px 0 0}
.actions{display:grid;gap:10px;margin-top:22px}
.confirm-note{font-size:13px;color:var(--ink-soft);margin:14px 0 0;text-align:center}
@media (min-width:900px){
  .book{grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
  .panel{position:sticky;top:88px}
}

/* ---------- Good to know ---------- */
.keyfacts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:40px}
.keyfacts div{background:var(--bg);padding:20px}
.keyfacts span{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.keyfacts strong{font:400 1.5rem/1.2 var(--serif)}
@media (min-width:760px){.keyfacts{grid-template-columns:repeat(3,1fr)}}
@media (max-width:759px){.keyfacts div:last-child{grid-column:span 2}}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:14px 0;cursor:pointer;font:400 1.2rem/1.3 var(--serif)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";flex:none;width:12px;height:12px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-3px,-3px);transition:transform .3s}
.acc details[open] summary::after{transform:rotate(-135deg) translate(-3px,-3px)}
.acc .body{padding:0 0 22px;color:var(--ink-soft);max-width:44em}
.acc ul{margin:0;padding-left:1.1em}
.acc li{margin:4px 0}
@media (min-width:900px){.info{display:grid;grid-template-columns:5fr 7fr;gap:clamp(48px,8vw,120px)}}

/* ---------- Footer ---------- */
.foot{background:var(--dark);color:#E9E1D5;padding:72px 0 calc(40px + env(safe-area-inset-bottom))}
.foot h2{font-size:clamp(2rem,4vw,3rem);color:#fff;margin-bottom:12px}
.foot p{color:#C9BFB2}
.foot-grid{display:grid;gap:40px}
.foot-links{display:grid;gap:4px}
.foot-links a{display:inline-flex;align-items:center;gap:12px;min-height:44px;text-decoration:none;font-size:16px;color:#fff}
.foot-links a:hover{text-decoration:underline;text-underline-offset:5px}
.foot-links svg{width:20px;height:20px;color:#C9BFB2}
.credit{margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:13px;color:#ADA396}
.credit a{color:#ADA396}
@media (min-width:900px){.foot-grid{grid-template-columns:1.2fr 1fr;align-items:end}}

/* ---------- Mobile sticky bar ---------- */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px var(--gutter) calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);transition:transform .35s ease}
.mbar.hide{transform:translateY(110%)}
.mbar .from{font-size:15px;line-height:1.3}
.mbar .from strong{font:500 1.15rem var(--serif)}
.mbar .btn{min-height:46px;padding:0 20px}
@media (min-width:960px){.mbar{display:none}}
@media (max-width:959px){body{padding-bottom:72px}}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:60;background:rgba(22,18,15,.97);color:#fff;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.lb.open{opacity:1;visibility:visible;transition:opacity .35s ease}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px var(--gutter);min-height:60px;font-size:14px;color:#D6CEC3}
.lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px;touch-action:pan-y}

.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%)}

/* ---------- Date helpers (all dates are local midnight) ---------- */
const DAY_MS = 864e5;
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const daysBetween = (a, b) => Math.round((b - a) / DAY_MS); // DST-safe for local midnights
const startOfToday = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

/* ---------- Seeded random generator (mulberry32) ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Demo bookings: each week draws from its own seeded generator, anchored to a fixed
   Monday, so a given week always gets the same bookings, whatever day the page loads.
   Weekend stays are drawn more often than midweek ones (≈35–45% occupancy overall). */
function demoRanges(today = startOfToday()) {
  const anchor = new Date(2024, 0, 1);                       // a Monday
  const end = addMonths(today, CONFIG.bookingWindowMonths + 1);
  const taken = new Set();
  const ranges = [];
  const tryAdd = (start, len) => {
    for (let i = 0; i < len; i++) if (taken.has(dkey(addDays(start, i)))) return;
    for (let i = 0; i < len; i++) taken.add(dkey(addDays(start, i)));
    ranges.push({ start: dkey(start), end: dkey(addDays(start, len)) });
  };
  for (let w = Math.floor(daysBetween(anchor, today) / 7) - 2; ; w++) {
    const monday = addDays(anchor, w * 7);
    if (monday > end) break;
    const r = mulberry32(CONFIG.demoSeed * 7919 + w * 104729);
    if (r() < 0.06) tryAdd(addDays(monday, Math.floor(r() * 4)), 8 + Math.floor(r() * 9));      // long stay
    if (r() < 0.62) {                                                                           // weekend stay
      const thu = r() < 0.3;
      tryAdd(addDays(monday, thu ? 3 : 4), thu ? 3 + Math.floor(r() * 2) : 2 + (r() < 0.35 ? 1 : 0));
    }
    if (r() < 0.3) tryAdd(addDays(monday, Math.floor(r() * 2)), 2 + Math.floor(r() * 2));       // midweek stay
  }
  return ranges;
}

/* Turn [{start, end}] (end = check-out day, exclusive) into a Set of booked nights.
   A night is named by its date: '2026-10-03' is the night of 3 → 4 October. */
function rangesToNights(ranges) {
  const nights = new Set();
  for (const r of ranges || []) {
    const s = r.start || r.from || r[0], e = r.end || r.to || r[1];
    if (!s || !e) continue;
    for (let d = parseKey(s.slice(0, 10)), stop = parseKey(e.slice(0, 10)); d < stop; d = addDays(d, 1)) nights.add(dkey(d));
  }
  return nights;
}

/* =====================================================================
   AVAILABILITY: the ONLY place availability comes from.
   ─ Demo mode (CONFIG.icalProxyUrl === null): seeded fake bookings.
   ─ Live mode: set CONFIG.icalProxyUrl to your Cloudflare Worker. The Worker
     reads the Airbnb/Booking iCal feeds and must return JSON like:
         [ { "start": "2026-10-03", "end": "2026-10-06" }, … ]
     where `end` is the check-out date (that night is NOT booked).
     CORS must allow this site's origin.
   Returns a Promise<Set<'YYYY-MM-DD'>> of booked nights.
   ===================================================================== */
async function getBlockedDates() {
  if (CONFIG.icalProxyUrl) {
    const res = await fetch(CONFIG.icalProxyUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error('Availability request failed: ' + res.status);
    return rangesToNights(await res.json());
  }
  return rangesToNights(demoRanges());
}

/* ---------- Booking rules (pure functions, easy to test) ---------- */
function validateRange(checkin, checkout, blocked, today = startOfToday()) {
  if (!checkin || !checkout) return { ok: false, reason: 'incomplete' };
  const nights = daysBetween(checkin, checkout);
  if (nights <= 0) return { ok: false, reason: 'order' };
  if (checkin < today) return { ok: false, reason: 'past' };
  for (let i = 0; i < nights; i++) if (blocked.has(dkey(addDays(checkin, i)))) return { ok: false, reason: 'booked' };
  if (nights < CONFIG.minNights) return { ok: false, reason: 'minNights' };
  if (checkout > addMonths(today, CONFIG.bookingWindowMonths)) return { ok: false, reason: 'window' };
  return { ok: true, nights };
}

function quote(checkin, checkout) {
  const R = CONFIG.rates;
  const nights = daysBetween(checkin, checkout);
  let weekdayNights = 0, weekendNights = 0;
  for (let i = 0; i < nights; i++) R.weekendNights.includes(addDays(checkin, i).getDay()) ? weekendNights++ : weekdayNights++;
  const q = { nights, weekdayNights, weekendNights, weekdayAmount: 0, weekendAmount: 0, discount: 0, monthly: null, cleaning: CONFIG.fees.cleaning || 0 };
  if (R.monthly && nights >= R.monthly.minNights) {
    q.monthly = nights <= R.monthly.perNights ? R.monthly.price : Math.round(R.monthly.price / R.monthly.perNights * nights);
    q.accommodation = q.monthly;
  } else {
    q.weekdayAmount = weekdayNights * R.weekday;
    q.weekendAmount = weekendNights * R.weekend;
    const sub = q.weekdayAmount + q.weekendAmount;
    if (R.weeklyDiscount && nights >= R.weeklyDiscount.minNights) q.discount = Math.round(sub * R.weeklyDiscount.percent / 100);
    q.accommodation = sub - q.discount;
  }
  q.total = q.accommodation + q.cleaning;
  return q;
}

      rows.push(`<li class="total"><span>${esc(t('totalLine'))}</span><span>${money(q.total)}</span></li>`);
      breakdown = `<ul class="breakdown" aria-live="polite">${rows.join('')}</ul><p class="save">${icon('tag')}${esc(t('saveNote'))}</p>`;
    } else breakdown = `<p class="empty">${esc(t('emptyQuote'))}</p>`;

    let wa = '', mail = '';
    if (q) {
      const msg = buildMessage(q);
      const subject = t('msgSubject', { name: CONFIG.propertyName, in: fmtDate(ci, { day: 'numeric', month: 'short' }), out: fmtDate(co, { day: 'numeric', month: 'short', year: 'numeric' }) });
      wa = whatsappUrl(msg); mail = mailtoUrl(subject, msg);
    }
    const act = (href, key, ic, cls, ext) => href
      ? `<a class="btn ${cls}" href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${icon(ic)}${esc(t(key))}</a>`
      : `<a class="btn ${cls}" aria-disabled="true" role="link">${icon(ic)}${esc(t(key))}</a>`;
    const field = (lbl, d) => `<button type="button" class="field" data-goto="${d ? dkey(d) : ''}"><span>${esc(lbl)}</span><strong>${esc(d ? fmtDate(d, { weekday: 'short', day: 'numeric', month: 'short' }) : t('addDate'))}</strong></button>`;

    $('panel').innerHTML = `
      <p class="panel-from">${esc(t('fromNight', { p: money(Math.min(R.weekday, R.weekend)) }))} <small>${esc(t('perNight'))}</small></p>
      <div class="fields">${field(t('checkin'), ci)}${field(t('checkout'), co)}</div>
      <div class="guests">
        <div class="lbl"><span>${esc(t('guests'))}</span>${esc(t('guestsMax', { n: CONFIG.maxGuests }))}</div>
        <div class="stepper">
          <button type="button" class="icon-btn" data-guests="-1" aria-label="${esc(t('fewer'))}"${state.guests <= 1 ? ' disabled' : ''}>${icon('minus')}</button>
          <output aria-live="polite">${state.guests}</output>
          <button type="button" class="icon-btn" data-guests="1" aria-label="${esc(t('more'))}"${state.guests >= CONFIG.maxGuests ? ' disabled' : ''}>${icon('plus')}</button>
        </div>
      </div>
      ${breakdown}
      <div class="actions">${act(wa, 'reqWhatsapp', 'whatsapp', '', true)}${act(mail, 'reqEmail', 'mail', 'btn-line', false)}</div>
      <p class="confirm-note">${esc(t('confirmNote'))}</p>`;
  }

  /* ----- lightbox ----- */
  const lb = { list: [], i: 0, trigger: null };
  function lbShow(i, instant) {
    const n = lb.list.length; lb.i = (i + n) % n;
    const p = lb.list[lb.i], img = $('lbImg');
    const swap = () => { img.src = p.file; img.alt = L(p.alt); };
    $('lbCap').textContent = L(p.caption) || L(p.alt);
    $('lbCount').textContent = t('photoOf', { i: lb.i + 1, n });
    if (instant) swap();
    else { img.classList.add('fading'); setTimeout(() => { swap(); }, 180); }
    [lb.i + 1, lb.i - 1].forEach(j => { const q = lb.list[(j + n) % n]; if (q) new Image().src = q.file; });
  }
  $('lbImg').addEventListener('load', e => e.target.classList.remove('fading'));
  function lbOpen(list, i, trigger) {
    lb.list = list; lb.trigger = trigger;
    $('lbImg').classList.add('fading');
    lbShow(i, true);
    const el = $('lb'); el.classList.add('open'); el.setAttribute('aria-hidden', 'false');
    document.documentElement.style.overflow = 'hidden';
    $('lbClose').focus();
  }
  function lbClose() {
    const el = $('lb'); el.classList.remove('open'); el.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = '';
    if (lb.trigger) lb.trigger.focus({ preventScroll: true });
  }
  $('lbClose').addEventListener('click', lbClose);
  $('lbPrev').addEventListener('click', () => lbShow(lb.i - 1));
  $('lbNext').addEventListener('click', () => lbShow(lb.i + 1));
  $('lbStage').addEventListener('click', e => { if (e.target.id === 'lbStage') lbClose(); });
  document.addEventListener('keydown', e => {
    if (!$('lb').classList.contains('open')) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowLeft') lbShow(lb.i - 1);
    else if (e.key === 'ArrowRight') lbShow(lb.i + 1);
    else if (e.key === 'Tab') {       // keep focus inside the lightbox
      const f = [$('lbClose'), $('lbPrev'), $('lbNext')], idx = f.indexOf(document.activeElement);
      e.preventDefault(); f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  let touchX = null, touchY = null;
  $('lbStage').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  $('lbStage').addEventListener('touchend', e => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) lbShow(lb.i + (dx < 0 ? 1 : -1));
    touchX = null;
  });

  /* ----- events ----- */
  document.addEventListener('click', e => {
    const langBtn = e.target.closest('[data-lang]');
    if (langBtn && langBtn.dataset.lang !== state.lang) { state.lang = langBtn.dataset.lang; renderAll(); return; }
    const chip = e.target.closest('[data-filter]');
    if (chip) { state.filter = chip.dataset.filter; state.expanded = false; renderChips(); renderGallery(); return; }
    if (e.target.closest('#moreBtn')) {
      const wasExpanded = state.expanded; state.expanded = !state.expanded; renderGallery();
      if (wasExpanded) $('gallery').scrollIntoView({ behavior: 'smooth' });
      return;
    }
    const tile = e.target.closest('.tile');
    if (tile) { lbOpen(filtered(), +tile.dataset.index, tile); return; }
    const day = e.target.closest('.day');
    if (day && !day.disabled) { onDayClick(parseKey(day.dataset.date)); return; }
    const g = e.target.closest('[data-guests]');
    if (g) { state.guests = Math.max(1, Math.min(CONFIG.maxGuests, state.guests + +g.dataset.guests)); renderPanel(); document.querySelector(`[data-guests="${g.dataset.guests}"]`)?.focus(); return; }
    const field = e.target.closest('[data-goto]');
    if (field) {
      if (field.dataset.goto) { const d = parseKey(field.dataset.goto); state.view = new Date(d.getFullYear(), d.getMonth(), 1); renderCalendar(); }
      $('months').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  $('calPrev').addEventListener('click', () => { state.view = addMonths(state.view, -1); renderCalendar(); });
  $('calNext').addEventListener('click', () => { state.view = addMonths(state.view, 1); renderCalendar(); });
  mqDesktop.addEventListener('change', renderCalendar);

  /* ----- nav + sticky bar + reveal ----- */
  new IntersectionObserver(([en]) => $('nav').classList.toggle('solid', !en.isIntersecting), { rootMargin: '-64px 0px 0px 0px' }).observe($('top'));
  // Sticky bar hides over the hero (it has its own button) and once the calendar is in view.
  const inView = { top: true, availability: false };
  const barIO = new IntersectionObserver(entries => {
    entries.forEach(en => { inView[en.target.id] = en.isIntersecting; });
    $('mbar').classList.toggle('hide', inView.top || inView.availability);
  }, { threshold: 0.05, rootMargin: '0px 0px -30% 0px' });
  barIO.observe($('top')); barIO.observe($('availability'));
  $('mbar').classList.add('hide');
  const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  /* ----- boot ----- */
  function renderAll() { applyStatic(); renderHero(); renderChips(); renderGallery(); renderContent(); renderRates(); renderCalendar(); renderPanel(); }
  renderAll();
  getBlockedDates()
    .then(set => { state.blocked = set; })
    .catch(err => { console.warn(err); state.loadError = true; })
    .finally(() => { renderCalendar(); renderPanel(); });
}
</script>
</body>
</html>
